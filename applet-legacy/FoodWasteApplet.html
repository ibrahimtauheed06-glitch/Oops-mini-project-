<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Food Waste Management System - Java Applet</title>
</head>
<body style="background-color: #eef2f5; font-family: Arial, sans-serif; text-align: center; margin: 20px;">
    <h2>Food Waste Management System (OOP Mini-Project)</h2>
    <p>Java AWT Applet &bull; JDBC Database Operations &bull; MySQL 8.0</p>
    <div style="display: inline-block; border: 2px solid #2d5a3f; box-shadow: 0 4px 10px rgba(0,0,0,0.15);">
        <applet code="FoodWasteApplet.class" archive="lib/mysql-connector-j-8.0.33.jar" width="1160" height="690">
            <param name="db_host" value="localhost">
            <param name="db_port" value="3306">
            <param name="db_name" value="food_waste_db">
            <p style="color: red; padding: 20px;">Java Applet support is required to run this application. Use <code>appletviewer FoodWasteApplet.html</code> with JDK 8.</p>
        </applet>
    </div>
</body>
</html>
